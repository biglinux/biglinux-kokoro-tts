# BigLinux Kokoro TTS module for speech-dispatcher
# Uses the generic speech-dispatcher module to invoke sd_biglinux_kokoro

GenericExecuteSynth \
  "/usr/lib/speech-dispatcher-modules/sd_biglinux_kokoro '$DATA'"

GenericRateAdd 0
GenericPitchAdd 0
GenericVolumeAdd 0

GenericPunctNone ""
GenericPunctSome "."
GenericPunctMost ".,;:!?"
GenericPunctAll ".,;:!?@#$%^&*()_+-=[]{}|\\\"'<>/~`"
