# BigLinux Kokoro TTS module for speech-dispatcher
# Uses the generic speech-dispatcher module to invoke sd_biglinux_kokoro
# $LANGUAGE is the SSIP language code set by the client (e.g. "pt", "en")

GenericExecuteSynth \
  "KOKO_LANG='$LANGUAGE' /usr/lib/speech-dispatcher-modules/sd_biglinux_kokoro '$DATA'"

GenericRateAdd 0
GenericPitchAdd 0
GenericVolumeAdd 0

GenericPunctNone ""
GenericPunctSome "."
GenericPunctMost ".,;:!?"
GenericPunctAll ".,;:!?@#$%^&*()_+-=[]{}|\\\"'<>/~`"
