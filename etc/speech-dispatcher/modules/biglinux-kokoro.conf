# BigLinux Kokoro TTS module for speech-dispatcher
# Uses the generic speech-dispatcher module to invoke kokoro-speak
# $LANGUAGE is the SSIP language code set by the client (e.g. "pt", "en")

GenericExecuteSynth \
  "KOKO_LANG='$LANGUAGE' /usr/lib/biglinux-kokoro-tts/kokoro-speak '$DATA'"

GenericRateAdd 0
GenericPitchAdd 0
GenericVolumeAdd 0

# Punctuation settings (GenericPunctNone needs a non-empty placeholder)
GenericPunctNone " "
GenericPunctSome "."
GenericPunctMost ".,;:!?"
GenericPunctAll ".,;:!?@#$%^&*()_+-=[]{}|\\\"'<>/~`"

# Voice definitions — speech-dispatcher needs at least one to initialize
# Format: AddVoice "language" "MALE1/FEMALE1" "name"
AddVoice "en" "FEMALE1" "af_heart"
AddVoice "es" "FEMALE1" "ef_dora"
AddVoice "fr" "FEMALE1" "ff_siwis"
AddVoice "pt" "FEMALE1" "pf_dora"
AddVoice "it" "FEMALE1" "if_sara"
AddVoice "ja" "FEMALE1" "jf_alpha"
AddVoice "hi" "FEMALE1" "hf_alpha"
AddVoice "zh" "FEMALE1" "zf_xiaobei"
