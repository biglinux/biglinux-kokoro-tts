# BigLinux Kokoro TTS - Locale to voice mapping
#
# Format: locale = engine:voice:lang_code
#
# engine    = kokoro | espeak
# voice     = style name (e.g. pf_dora) or espeak voice code
# lang_code = espeak-ng language code (e.g. pt, en-us, es, fr, ja, zh)
#             Ref: https://github.com/espeak-ng/espeak-ng/blob/master/docs/languages.md
#
# User-editable. Changes survive upgrades (.pacnew).

# ─── Kokoro (neural voice, high quality) ───────────────────

# English
en_US = kokoro:af_heart:en-us
en_GB = kokoro:bf_emma:en-gb
en_AU = kokoro:af_heart:en-us
en_CA = kokoro:af_heart:en-us
en_NZ = kokoro:af_heart:en-us
en_IN = kokoro:af_heart:en-us

# Spanish
es_ES = kokoro:ef_dora:es
es_MX = kokoro:ef_dora:es
es_AR = kokoro:ef_dora:es
es_CL = kokoro:ef_dora:es
es_CO = kokoro:ef_dora:es
es_PE = kokoro:ef_dora:es
es_VE = kokoro:ef_dora:es

# French
fr_FR = kokoro:ff_siwis:fr
fr_CA = kokoro:ff_siwis:fr
fr_BE = kokoro:ff_siwis:fr

# Portuguese
pt_BR = kokoro:pf_dora:pt
pt_PT = kokoro:pf_dora:pt

# Italian
it_IT = kokoro:if_sara:it

# Japanese
ja_JP = kokoro:jf_alpha:ja

# Hindi
hi_IN = kokoro:hf_alpha:hi

# Mandarin Chinese
zh_CN = kokoro:zf_xiaobei:zh
zh_TW = kokoro:zf_xiaobei:zh

